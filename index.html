<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Планировщик">
<link rel="manifest" href="manifest.webmanifest">
<title>Планировщик дня</title>
<style>
/* Fix: compact delete buttons on mobile */
[data-del-act]{flex:0 0 42px !important;width:42px !important;min-width:42px;max-width:42px;height:42px;min-height:42px;padding:0 !important;display:flex;align-items:center;justify-content:center}
[data-del-todo]{flex:0 0 42px !important;width:42px !important;min-width:42px;max-width:42px;height:42px;min-height:42px;padding:0 !important;display:flex;align-items:center;justify-content:center}
@media(max-width:430px){.btn{width:auto}}
:root{--bg:#080c17;--card:#11182a;--card2:#172038;--text:#f4f7ff;--muted:#9aa6bf;--line:#26314b;--accent:#7c8cff;--green:#39d98a;--red:#ff647c;--shadow:0 12px 35px #0007}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100dvh;padding-bottom:calc(24px + env(safe-area-inset-bottom));}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{width:min(760px,100%);margin:auto;padding:16px 14px}
header{padding:8px 4px 18px}
h1{font-size:25px;margin:0 0 5px}
.subtitle{color:var(--muted);font-size:14px}
.clock{margin-top:13px;font-size:30px;font-weight:800;letter-spacing:1px}
.date{color:var(--muted);font-size:14px;margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat,.card{background:linear-gradient(145deg,var(--card),#0d1424);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.stat{padding:12px 8px;text-align:center}
.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:var(--muted)}
.card{padding:14px;margin-bottom:12px}
h2{font-size:17px;margin:0 0 12px}
.tabs{display:flex;gap:7px;overflow-x:auto;padding-bottom:5px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:1px solid var(--line);background:var(--card2);color:var(--muted);border-radius:999px;padding:9px 13px;white-space:nowrap}
.tab.active{background:var(--accent);border-color:var(--accent);color:white}
.item{display:flex;gap:11px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.time{min-width:54px;font-weight:800;color:#b9c1ff}
.item-main{min-width:0;flex:1}.item-title{font-weight:700}.item-note{font-size:12px;color:var(--muted);margin-top:3px}
.badge{display:inline-block;font-size:10px;padding:4px 7px;border-radius:8px;background:#222d49;color:#bfc8e4;margin-top:6px}
.row{display:flex;gap:8px}.row>*{min-width:0;flex:1}
input,select,textarea{width:100%;background:#0b1120;border:1px solid var(--line);color:var(--text);border-radius:13px;padding:12px;outline:none}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
.btn{min-height:46px;border:0;border-radius:13px;padding:0 16px;background:var(--accent);color:#fff;font-weight:800}
.btn.secondary{background:var(--card2);border:1px solid var(--line)}
.btn.danger{background:#3a1721;color:#ff9aaa}
form{display:grid;gap:9px}
.todo{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.todo:last-child{border-bottom:0}
.todo input[type=checkbox]{width:22px;height:22px;accent-color:var(--green);flex:0 0 auto}
.todo.done .todo-text{text-decoration:line-through;color:var(--muted)}
.note{background:#0c1322;border:1px solid var(--line);border-radius:14px;padding:11px;margin-top:8px}
.note-title{font-weight:800}.note-text{white-space:pre-wrap;color:#c8d0e3;font-size:13px;margin-top:4px}
.progress{height:11px;background:#202a42;border-radius:99px;overflow:hidden}
.progress>div{height:100%;background:linear-gradient(90deg,#7c8cff,#39d98a);width:0%;transition:.25s}
.empty{color:var(--muted);text-align:center;padding:18px 5px;font-size:14px}
.install{display:none;margin-bottom:12px}
footer{text-align:center;color:#69758e;font-size:11px;padding:12px}
@media(max-width:430px){.app{padding:12px 10px}.stats{gap:6px}.stat{padding:10px 5px}.stat b{font-size:18px}.row{flex-direction:column}.btn{width:100%}}
</style>
</head>
<body>
<main class="app">
<header>
  <h1>📅 Планировщик дня</h1>
  <div class="subtitle">Мой день — под моим контролем</div>
  <div id="clock" class="clock">--:--</div>
  <div id="date" class="date">Загрузка…</div>
</header>

<button id="installBtn" class="btn install">📲 Установить приложение</button>

<section class="stats">
  <div class="stat"><b id="total">0</b><span>Всего</span></div>
  <div class="stat"><b id="done">0</b><span>Выполнено</span></div>
  <div class="stat"><b id="left">0</b><span>Осталось</span></div>
  <div class="stat"><b id="percent">0%</b><span>Прогресс</span></div>
</section>

<section class="card">
  <h2>Прогресс дня</h2>
  <div class="progress"><div id="progressBar"></div></div>
</section>

<section class="card">
  <h2>Расписание</h2>
  <div id="tabs" class="tabs">
    <button class="tab active" data-cat="all">Все</button>
    <button class="tab" data-cat="school">Школа</button>
    <button class="tab" data-cat="sport">Спорт</button>
    <button class="tab" data-cat="game">Игра</button>
    <button class="tab" data-cat="hobby">Хобби</button>
    <button class="tab" data-cat="friend">Друзья</button>
    <button class="tab" data-cat="home">Дом</button>
  </div>
  <div id="schedule"></div>
</section>

<section class="card">
  <h2>➕ Добавить занятие</h2>
  <form id="activityForm">
    <div class="row">
      <input id="activityTime" type="time" required>
      <select id="activityCat">
        <option value="school">Школа</option><option value="sport">Спорт</option>
        <option value="game">Игра</option><option value="hobby">Хобби</option>
        <option value="friend">Друзья</option><option value="home">Дом</option>
      </select>
    </div>
    <input id="activityName" placeholder="Название занятия" required>
    <input id="activityNote" placeholder="Комментарий (необязательно)">
    <button class="btn" type="submit">Добавить</button>
  </form>
</section>

<section class="card">
  <h2>✅ Задачи</h2>
  <form id="todoForm" class="row">
    <input id="todoText" placeholder="Новая задача" required>
    <button class="btn" type="submit">+</button>
  </form>
  <div id="todos"></div>
</section>

<section class="card">
  <h2>📝 Заметки</h2>
  <form id="noteForm">
    <input id="noteTitle" placeholder="Заголовок" required>
    <textarea id="noteText" placeholder="Текст заметки" required></textarea>
    <button class="btn" type="submit">Добавить заметку</button>
  </form>
  <div id="notes"></div>
</section>

<footer>Работает как приложение • данные сохраняются на этом устройстве</footer>
</main>

<script>
"use strict";
const KEY="day_planner_pwa_v1";
let state=JSON.parse(localStorage.getItem(KEY)||"null")||{
 activities:[
  {id:1,time:"07:30",name:"Подъём и завтрак",cat:"home",note:""},
  {id:2,time:"08:30",name:"Школа",cat:"school",note:""},
  {id:3,time:"16:00",name:"Спорт",cat:"sport",note:""},
  {id:4,time:"18:00",name:"Свободное время",cat:"game",note:""}
 ],
 todos:[{id:1,text:"Сделать домашнее задание",done:false}],
 notes:[]
};
let activeCat="all";
const $=id=>document.getElementById(id);
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function uid(){return Date.now()+Math.random()}
function clock(){
 const d=new Date();
 $("clock").textContent=d.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
 $("date").textContent=d.toLocaleDateString("ru-RU",{weekday:"long",day:"numeric",month:"long"});
}
function render(){
 const list=state.activities.filter(x=>activeCat==="all"||x.cat===activeCat)
 .slice().sort((a,b)=>a.time.localeCompare(b.time));
 $("schedule").innerHTML=list.length?list.map(x=>`
 <div class="item"><div class="time">${escapeHtml(x.time)}</div><div class="item-main">
 <div class="item-title">${escapeHtml(x.name)}</div>${x.note?`<div class="item-note">${escapeHtml(x.note)}</div>`:""}
 <span class="badge">${catName(x.cat)}</span></div>
 <button class="btn secondary" style="flex:0 0 auto;padding:0 12px" data-del-act="${x.id}">×</button></div>`).join("")
 :'<div class="empty">Пока ничего нет</div>';

 $("todos").innerHTML=state.todos.length?state.todos.map(x=>`
 <div class="todo ${x.done?"done":""}">
 <input type="checkbox" ${x.done?"checked":""} data-todo="${x.id}">
 <div class="todo-text">${escapeHtml(x.text)}</div>
 <button class="btn secondary" style="min-height:38px;padding:0 11px" data-del-todo="${x.id}">×</button>
 </div>`).join(""):'<div class="empty">Задач нет</div>';

 $("notes").innerHTML=state.notes.length?state.notes.map(x=>`
 <div class="note"><div class="note-title">${escapeHtml(x.title)}</div>
 <div class="note-text">${escapeHtml(x.text)}</div>
 <button class="btn danger" style="min-height:36px;margin-top:8px" data-del-note="${x.id}">Удалить</button></div>`).join("")
 :'<div class="empty">Заметок нет</div>';

 const total=state.todos.length, done=state.todos.filter(x=>x.done).length;
 const pct=total?Math.round(done/total*100):0;
 $("total").textContent=total;$("done").textContent=done;$("left").textContent=total-done;
 $("percent").textContent=pct+"%";$("progressBar").style.width=pct+"%";
}
function catName(c){return {school:"Школа",sport:"Спорт",game:"Игра",hobby:"Хобби",friend:"Друзья",home:"Дом"}[c]||c}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}

$("activityForm").addEventListener("submit",e=>{
 e.preventDefault();
 state.activities.push({id:uid(),time:$("activityTime").value,name:$("activityName").value.trim(),cat:$("activityCat").value,note:$("activityNote").value.trim()});
 save();e.target.reset();render();
});
$("todoForm").addEventListener("submit",e=>{
 e.preventDefault();const t=$("todoText").value.trim();if(!t)return;
 state.todos.push({id:uid(),text:t,done:false});save();e.target.reset();render();
});
$("noteForm").addEventListener("submit",e=>{
 e.preventDefault();state.notes.push({id:uid(),title:$("noteTitle").value.trim(),text:$("noteText").value.trim()});
 save();e.target.reset();render();
});
$("tabs").addEventListener("click",e=>{
 const b=e.target.closest("[data-cat]");if(!b)return;
 activeCat=b.dataset.cat;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===b));render();
});
document.addEventListener("click",e=>{
 const a=e.target.closest("[data-del-act]");if(a){state.activities=state.activities.filter(x=>String(x.id)!==a.dataset.delAct);save();render();return}
 const t=e.target.closest("[data-del-todo]");if(t){state.todos=state.todos.filter(x=>String(x.id)!==t.dataset.delTodo);save();render();return}
 const n=e.target.closest("[data-del-note]");if(n){state.notes=state.notes.filter(x=>String(x.id)!==n.dataset.delNote);save();render();return}
});
document.addEventListener("change",e=>{
 const t=e.target.closest("[data-todo]");if(!t)return;
 const x=state.todos.find(x=>String(x.id)===t.dataset.todo);if(x){x.done=t.checked;save();render()}
});
let deferredPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;$("installBtn").style.display="block"});
$("installBtn").addEventListener("click",async()=>{
 if(!deferredPrompt)return;
 deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;$("installBtn").style.display="none";
});
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(console.error));
clock();setInterval(clock,1000);render();
</script>
</body>
</html>
